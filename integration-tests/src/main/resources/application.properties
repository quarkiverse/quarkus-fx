# The integration tests run a command mode application : see the @QuarkusMain class of this module (FxItMain)
quarkus.banner.enabled=false
# The FXML views (@FxView controllers) : views/<Name>.fxml, views/<Name>.properties, their stylesheets
quarkus.fx.views-root=views
# Quarkus FX only includes the FXML, CSS and properties files of the views root in native executables : the images of
# the views, and the resources of the checks (names with spaces and a non-ASCII character, WebView page)
quarkus.native.resources.includes=views/**,assets/**
