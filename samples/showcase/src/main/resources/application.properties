quarkus.banner.enabled=false
quarkus.log.console.format=%d{HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n

# quarkus-fx views (see FxmlViewPage)
quarkus.fx.views-root=fxviews

# Feature pages are only looked up through Instance<FeaturePage>
quarkus.arc.remove-unused-beans=false

# Pages relying on AWT (Swing interop, printing) work in native executables with Quarkus Desktop (quarkus-desktop-swing),
# quarkus-fx then registers the JavaFX side. Without it, exclude them with
# quarkus.arc.exclude-types=io.quarkiverse.fx.showcase.pages.swing.**,io.quarkiverse.fx.showcase.pages.platform.PlatformPrintingPage,io.quarkiverse.fx.showcase.pages.platform.PlatformAwtPage

# Application resources (images, fonts, media, web content, stylesheets)
quarkus.native.resources.includes=showcase/**

# Snapshot mode is enabled by setting showcase.snapshot.dir (see tools/Snapshot.java)
showcase.snapshot.exit=true
showcase.snapshot.settle-millis=400
showcase.snapshot.ready-timeout-seconds=30
