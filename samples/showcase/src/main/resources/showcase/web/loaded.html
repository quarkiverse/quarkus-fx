<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Loaded from the classpath</title>
<link rel="stylesheet" href="loaded.css">
<script src="loaded.js"></script>
</head>
<body>
<h1>Classpath URL</h1>
<p class="lead">Relative sub-resources:</p>
<ul>
<li><code>loaded.css</code> (link)</li>
<li><code>loaded.js</code> (script)</li>
<li><code>../images/pattern.png</code> (img, unscaled)</li>
</ul>
<div class="crop"><img id="img" src="../images/pattern.png" alt="pattern"></div>
<p id="script-out">loaded.js did not run</p>
</body>
</html>
